<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <div class="container">
        <f:if condition="{breadcrumb} && !{data.tx_conn_t3wtk_base_hide_breadcrumb}">
            <f:render partial="Page/Breadcrumb" arguments="{breadcrumb: breadcrumb}" />
        </f:if>

        <f:cObject typoscriptObjectPath="styles.content.get" />
    </div>
</f:section>

</html>
