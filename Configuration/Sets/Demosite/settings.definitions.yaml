categories:
  conn.demosite:
    label: 'Demo site'

settings:
  demosite.themeSwitcher.enabled:
    label: 'Theme preview switcher'
    description: 'Shows a small "Themes" button at a screen edge (see "Theme preview switcher – position") that expands to let visitors preview every installed conn/t3kit-theme-* set. The site must have one theme set selected; the choice is stored per visitor in a cookie.'
    type: bool
    default: true
    category: conn.demosite

  demosite.themeSwitcher.position:
    label: 'Theme preview switcher – position'
    description: 'Screen edge the "Themes" button is docked to (first word) and where along that edge it sits (second word). The panel opens away from that edge.'
    type: string
    default: right-bottom
    category: conn.demosite
    enum:
      right-top: 'Right edge – top'
      right-middle: 'Right edge – middle'
      right-bottom: 'Right edge – bottom'
      left-top: 'Left edge – top'
      left-middle: 'Left edge – middle'
      left-bottom: 'Left edge – bottom'
      top-left: 'Top edge – left'
      top-center: 'Top edge – center'
      top-right: 'Top edge – right'
      bottom-left: 'Bottom edge – left'
      bottom-center: 'Bottom edge – center'
      bottom-right: 'Bottom edge – right'

  demosite.logo.onLight:
    label: 'Demo logo – for light backgrounds'
    description: 'Dark logo variant. Used for every navbar/footer logo slot whose background is light in the active theme (unless branding.logo* / footer.logo* are set). EXT: path, fileadmin path or full URL.'
    type: string
    default: 'fileadmin/conn_t3kit_demosite/images/t3kit-logo-dark.svg'
    category: conn.demosite

  demosite.logo.onDark:
    label: 'Demo logo – for dark backgrounds'
    description: 'Light logo variant. Used for every navbar/footer logo slot whose background is dark in the active theme (e.g. Midnight''s navbar). Empty both to show the site title instead.'
    type: string
    default: 'fileadmin/conn_t3kit_demosite/images/t3kit-logo-light.svg'
    category: conn.demosite
