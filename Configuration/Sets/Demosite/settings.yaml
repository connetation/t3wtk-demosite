# The look (colors, navigation, footer, toggle position) comes from a connetation/t3wtk-base
# theme Set selected next to this one (connetation/t3wtk-theme-*). Only set keys here that no
# theme sets — otherwise the order between this Set and the theme is undefined.
themeToggle.enabled: true

# Demo favicons (generated by Build/generate-favicons.sh). No theme sets branding.*.
branding.favicon: 'EXT:conn_t3wtk_demosite/Resources/Public/Icons/Favicon/favicon.svg'
branding.faviconIco: 'EXT:conn_t3wtk_demosite/Resources/Public/Icons/Favicon/favicon.ico'
branding.appleTouchIcon: 'EXT:conn_t3wtk_demosite/Resources/Public/Icons/Favicon/apple-touch-icon.png'
branding.manifestIcon192: 'EXT:conn_t3wtk_demosite/Resources/Public/Icons/Favicon/icon-192.png'
branding.manifestIcon512: 'EXT:conn_t3wtk_demosite/Resources/Public/Icons/Favicon/icon-512.png'

# Small gap between main content and footer (instead of the default --conn-space-lg).
footer.beforeSpacing: default
